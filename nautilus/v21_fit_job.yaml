# v2.1 Task 3 — the FULL 2.1 re-fit (normalized geometry) over the v2 store.
# claude_prompts/v2/build_v2_1_rerun.md Plan §4.
#
# 15,971 matchups (every one with a 2.0 chain NPZ; V3), selected by
# /data/v2/v21/refit_all.csv (staged with the DB; the :2.1.0 image predates it).
# FitConfig() = 2.1: robust_hybrid at (0,0,0), Ed(0°), free B_p, 2.0.1 ceilings.
# Each spectrum is replayed bit-identically from /data/v2/fit_chains/<2.0>.npz.
# New rows are `…_v2.1`; the 2.0 / 2.0.1 / NASA rows are never written (only
# the v5 -> v6 migration adds the NULL `geom_mode` column on first open).
# Chains land beside the 2.0 ones in /data/v2/fit_chains (PAB_DATA_DIR=/data/v2).
#
# STAGING (before the first apply; confirmed with JXP):
#   /data/v2/pab.db          = the workstation live DB, sha 9503015b…cad92
#   /data/v2/v21/refit_all.csv  sha a244835e…ebc62
# The job refuses to start a FRESH run (no 2.1 rows yet) on any other DB sha,
# and refuses any DB that lacks the 51 2.0.1 rows (the stale PVC copy did).
# A resume (backoff retry or re-apply) starts from the checkpointed DB, whose
# sha has moved on, so the sha check applies only when 2.1 rows = 0.
#
# COST, measured by the Task 2 slice: 244 s/fit at 50 workers ->
#   15,971 × 244 / 50 ≈ 21.6 h, + ~5 min compile; memory flat ~26 GB.
# Measure s/fit from the `created` stamps, NEVER from total wall / fits or
# from the progress-line median (which counts queue time).
#
# *** DB-LOCAL, not optional. *** SQLite on CephFS wedged four pods in the 1.0
# run. Copy to emptyDir, run there, checkpoint back every 2 min by local
# sqlite3.backup() + plain file copy. Never sqlite3.backup() onto CephFS.
# max_tasks_per_child: not needed for `fit` (settled in v2 Prompt 7).
#
# CUSTODY: while this runs, the PVC DB is the master. No writes to the
# workstation v2 DB until it is pulled back (sha both sides).
#
# Usage (after JXP confirms):
#   kubectl -n sea-meets-the-stars delete job pab-v21-fit --ignore-not-found
#   kubectl apply -f nautilus/v21_fit_job.yaml
#   kubectl -n sea-meets-the-stars logs -f job/pab-v21-fit
apiVersion: batch/v1
kind: Job
metadata:
  name: pab-v21-fit
  namespace: sea-meets-the-stars
spec:
  backoffLimit: 6                 # preemption-tolerant; a resume skips finished fits
  activeDeadlineSeconds: 172800   # 48 h against a ~22 h expectation
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pab
        image: gitlab-registry.nrp-nautilus.io/profx/pab:2.1.0   # validated by the Task 2 slice
        imagePullPolicy: Always
        env:
        - {name: HOME, value: /root}
        - {name: PAB_DATA_DIR, value: /data/v2}   # 2.1 chains -> /data/v2/fit_chains
        - {name: RUN, value: /data/v2}
        - {name: SEL, value: /data/v2/v21/refit_all.csv}
        - {name: SEL_SHA, value: a244835e8f4c6c5ff5db86048bd4f10afb1d9183389be0e7da0d4d5cd59ebc62}
        - {name: DB_SHA, value: 9503015bf3d5427ff119cb621e9ecf9b0a41cf2f39b7325529e390428bfcad92}
        - {name: PYTHONWARNINGS, value: "ignore"}  # robust emits a DomainWarning per forward call
        - {name: MALLOC_ARENA_MAX, value: "2"}
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -o pipefail
            ulimit -n 65536 2>/dev/null || true
            mkdir -p $RUN/v21
            LOG=$RUN/v21/fit_v21.log
            log() { echo "=== $1 $(date -Is) ===" | tee -a $LOG; }
            LOCAL=/scratch/pab.db
            BKUP="import sqlite3,os,shutil; s=sqlite3.connect('/scratch/pab.db'); d=sqlite3.connect('/scratch/pab.bak'); s.backup(d); d.close(); s.close(); shutil.copy('/scratch/pab.bak','/data/v2/pab.db.tmp'); os.replace('/data/v2/pab.db.tmp','/data/v2/pab.db')"
            counts() { python -c "import sqlite3; c=sqlite3.connect('$1'); cols=[r[1] for r in c.execute('PRAGMA table_info(fits)')]; g='geom_mode' if 'geom_mode' in cols else 'NULL'; print('schema', c.execute('PRAGMA user_version').fetchone()[0], 'fits by (algorithm, version, geom_mode):', c.execute(f'SELECT algorithm, pab_version, {g}, COUNT(*) FROM fits GROUP BY 1,2,3').fetchall())" 2>&1 | tee -a $LOG; }
            n21() { python -c "import sqlite3; print(sqlite3.connect('file:$1?mode=ro', uri=True).execute(\"SELECT COUNT(*) FROM fits WHERE pab_version='2.1'\").fetchone()[0])"; }
            n201() { python -c "import sqlite3; print(sqlite3.connect('file:$1?mode=ro', uri=True).execute(\"SELECT COUNT(*) FROM fits WHERE pab_version='2.0.1'\").fetchone()[0])"; }
            log "PROVENANCE (attempt on $(hostname))"
            python -c "import json; from pab.config import package_versions, pab_version; from pab.db.schema import SCHEMA_VERSION; from pab.fit import FitConfig; pv=package_versions(); print('pab_version', pab_version, 'pkg', pv['pab'], 'schema', SCHEMA_VERSION, 'geometry_mode', FitConfig().geometry_mode); print('git_sha', json.dumps(pv['git_sha']))" 2>&1 | tee -a $LOG

            log "PRE-FLIGHT"
            echo "$SEL_SHA  $SEL" | sha256sum -c - 2>&1 | tee -a $LOG || { log "ABORT: selection sha"; exit 2; }
            SHA=$(sha256sum $RUN/pab.db | cut -d' ' -f1); echo "PVC pab.db sha $SHA" | tee -a $LOG
            N21=$(n21 $RUN/pab.db); N201=$(n201 $RUN/pab.db)
            echo "2.1 rows on PVC: $N21; 2.0.1 rows: $N201" | tee -a $LOG
            [ "$N201" = 51 ] || { log "ABORT: PVC DB has $N201 2.0.1 rows, not 51 (stale copy?)"; exit 2; }
            if [ "$N21" = 0 ] && [ "$SHA" != "$DB_SHA" ]; then log "ABORT: fresh run on a DB that is not the staged live copy"; exit 2; fi
            python - <<'PY' 2>&1 | tee -a $LOG
            import csv, os, sys
            rows = list(csv.DictReader(open(os.environ["SEL"])))
            miss = [r["fit_id_v2_0"] for r in rows if not os.path.isfile(os.path.join(os.environ["RUN"], "fit_chains", r["fit_id_v2_0"] + ".npz"))]
            print("selection", len(rows), "| replay NPZs present:", len(rows) - len(miss), "| missing:", miss[:5])
            sys.exit(3 if miss or len(rows) != 15971 else 0)
            PY
            [ $? = 0 ] || { log "ABORT: selection / NPZ check"; exit 2; }

            log "DB-local: copy $RUN/pab.db -> $LOCAL"
            cp $RUN/pab.db $LOCAL
            log "BEFORE"; counts $LOCAL
            ( while true; do sleep 120; python -c "$BKUP" 2>>$LOG && echo "=== DB backup $(date -Is) ===" >>$LOG || true; done ) &
            BGPID=$!
            ( while true; do
                M=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo 0)
                echo "MEMSAMPLE $(date -Is) cgroup_gb=$(python -c "print(f'{$M/1073741824:.1f}')")" >> $LOG
                sleep 300
              done ) &
            MEMPID=$!

            log "FULL 2.1 FIT start (--jobs 50, FitConfig() = normalized)"
            if ! pab --db $LOCAL --outdir $RUN/pipeline --stage fit --jobs 50 \
                  --matchups-csv $SEL --replay-chains /data/v2/fit_chains 2>&1 | tee -a $LOG; then
              log "FULL 2.1 FIT FAILED — final DB sync + stopping (re-apply to resume)"
              python -c "$BKUP" 2>>$LOG || true
              kill $BGPID $MEMPID 2>/dev/null || true
              counts $LOCAL; exit 1
            fi
            log "FULL 2.1 FIT end — final DB sync to CephFS"
            kill $BGPID $MEMPID 2>/dev/null || true
            python -c "$BKUP" 2>>$LOG || true
            log "AFTER"; counts $LOCAL
            log "CLOSE-OUT GATES"
            python -c "import sqlite3; c=sqlite3.connect('$LOCAL'); q=lambda s: c.execute(s).fetchone()[0]; print('integrity:', q('PRAGMA integrity_check')); print('2.1 rows:', q(\"SELECT COUNT(*) FROM fits WHERE pab_version='2.1'\"), '(target 15971)'); print('2.1 not normalized:', q(\"SELECT COUNT(*) FROM fits WHERE pab_version='2.1' AND (geom_mode IS NULL OR geom_mode!='normalized')\"), '(must be 0)'); print('2.1 LM success:', q(\"SELECT SUM(success) FROM fits WHERE pab_version='2.1'\")); print('2.1 replayed:', q(\"SELECT COUNT(*) FROM fits WHERE pab_version='2.1' AND rrs_source LIKE '%:replay:%'\")); print('duplicate fit_ids:', q('SELECT COUNT(*) FROM (SELECT fit_id FROM fits GROUP BY fit_id HAVING COUNT(*)>1)'))" 2>&1 | tee -a $LOG
            log "CHAINS"
            echo "v2.1 NPZ: $(ls /data/v2/fit_chains | grep -c '_v2.1.npz$')  v2.0 NPZ: $(ls /data/v2/fit_chains | grep -c '_v2.0.npz$')" | tee -a $LOG
            sha256sum $RUN/pab.db | tee -a $LOG
            log "V21_FIT_DONE"
        resources:
          requests: {cpu: "50", memory: "100Gi", ephemeral-storage: "20Gi"}
          limits: {cpu: "50", memory: "100Gi", ephemeral-storage: "40Gi"}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: scratch, mountPath: /scratch}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: pab-data}}
      - {name: scratch, emptyDir: {sizeLimit: 5Gi}}
