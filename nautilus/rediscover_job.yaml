# Task 16 — targeted re-search of the 10,101 profiles `discover` skipped.
#
# Task 15's discover skipped these because *some* already-stored granule covered
# them in space and time, so they never got their own CMR search and their
# candidate pool is whatever a neighbour incidentally found. match's selection is
# only as good as that pool, so this runs before the ~40 h match stage.
#
# Two flags carry the whole point:
#   --profiles-csv /data/rediscover_profiles.csv   restricts discover to these
#       10,101 profiles (discover honours an *explicit* selection as of 2026-08-05;
#       without that it would sweep all 53,618 — ~8 h instead of ~2 h)
#   --replace                                     REQUIRED: the coverage test is
#       exactly what skipped them, and it would skip them again — more so now that
#       the store holds 60,601 granules rather than 2,734
#
# Expect ~10,101 searches at ~0.66 s each over 8 threads => ~2 h, 0 failures, and
# granules climbing from 60,601 toward the ~124k the independent CMR count found.
#
# Usage:
#   kubectl -n sea-meets-the-stars delete job pab-rediscover --ignore-not-found
#   kubectl apply -f nautilus/rediscover_job.yaml
#   kubectl -n sea-meets-the-stars logs -f job/pab-rediscover
apiVersion: batch/v1
kind: Job
metadata:
  name: pab-rediscover
  namespace: sea-meets-the-stars
spec:
  backoffLimit: 4          # resumable: a preempted pod re-runs what is missing
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: pab
        image: gitlab-registry.nrp-nautilus.io/profx/pab:1.0.2
        imagePullPolicy: IfNotPresent
        env:
        - {name: HOME, value: /root}
        - {name: PAB_DATA_DIR, value: /data}
        - {name: PYTHONPATH, value: /data/src}
        - {name: RUN, value: /data/full}
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -o pipefail
            log() { echo "=== $1 $(date -Is) ===" | tee -a $RUN/run.log; }
            counts() { python -c "import os,sqlite3; c=sqlite3.connect(os.environ['RUN']+'/pab.db'); print('counts:', {t: c.execute('SELECT COUNT(*) FROM '+t).fetchone()[0] for t in ('profiles','granules','matchups','matchup_pixels','fits','fit_results')})" 2>&1 | tee -a $RUN/run.log; }
            log "REDISCOVER start (10,101 skipped profiles, --replace, discover-jobs=8)"
            counts
            if ! pab --db $RUN/pab.db --outdir $RUN/pipeline \
              --profiles-csv /data/rediscover_profiles.csv \
              --stage discover --replace --discover-jobs 8 2>&1 \
              | tee -a $RUN/run.log; then
              log "REDISCOVER FAILED — stopping (re-apply the Job to resume)"
              counts
              exit 1
            fi
            log "REDISCOVER end"
            counts
            log "REDISCOVER_DONE"
        resources:
          requests: {cpu: "4", memory: "16Gi", ephemeral-storage: "10Gi"}
          limits: {cpu: "4", memory: "16Gi", ephemeral-storage: "20Gi"}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: netrc, mountPath: /root/.netrc, subPath: .netrc}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: pab-data}}
      - {name: netrc, secret: {secretName: earthdata-netrc}}
