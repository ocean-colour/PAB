# Prompt 5 Task 5 — per-pixel viewing geometry from PACE L1B, whole v2 DB.
#
# Fills theta_s / theta_v / dphi / geom_source on every matchup_pixels row.
# Runs BETWEEN match and fit: the 2.0 inelastic RT backend needs the angles at
# fit time, and the read is per GRANULE, so grouping turns ~160k potential
# 1.8 GB L1B opens into ~13.5k.
#
# --jobs 8, NOT 16. This stage issues one UNCACHED CMR query per granule on
# top of the L1B read, so --jobs 16 would mean 16 concurrent CMR searches
# against the same NASA infrastructure the working agreements already cap at
# --discover-jobs 8. This is an etiquette cap, not a performance choice.
#
# SIZING IS UNMEASURED AT LAUNCH — deliberately. The two single-granule
# numbers in hand disagree 5x (47 s in-pod, ~9 s on the workstation) and both
# are startup-dominated, so neither is a rate; the spread is the difference
# between a 4 h job and a 22 h one. Rather than build a synthetic 200-granule
# slice, this job IS the measurement: it logs "geometry progress: N/M
# granules" every 50 (pab.parallel.PROGRESS_EVERY), and the stage is
# idempotent on `theta_s IS NULL` with zero network work for filled pixels, so
# killing it after a few hundred granules costs nothing and resuming is just
# re-running it. Take the rate from ~200-400 granules in, NOT the first 50:
# the discover pool warmed for ~100 searches and an early sample over-projected
# by 2.2x (Prompt 5 Task 3).
#
# Gates (run automatically at the end, and safe to re-run):
#   - every matchup_pixels row has theta_s
#   - geom_source = 'L1B_V3' throughout
#   - theta_v spans 0..~60 deg; dphi inside (-180, 180]
#   - failures listed with causes (L1B missing from CMR, grid-check failure)
#
# The sweep for this stage is simply running it again.
#
# Usage:
#   kubectl -n sea-meets-the-stars delete job pab-v2-geometry --ignore-not-found
#   kubectl apply -f nautilus/v2_geometry_job.yaml
#   kubectl -n sea-meets-the-stars logs -f job/pab-v2-geometry
apiVersion: batch/v1
kind: Job
metadata:
  name: pab-v2-geometry
  namespace: sea-meets-the-stars
spec:
  # backoffLimit 30, NOT 4, because this stage OOMs and resumes by design until
  # the max_tasks_per_child fix lands (Q15). `build_geometry` builds its pool
  # WITHOUT max_tasks_per_child, which `match` sets precisely to bound
  # per-worker fsspec/HDF5 growth. Measured 2026-09-27 on the Fresno node:
  #
  #   granule  200   workers ~2.5 GB each   cgroup 16 GB
  #   granule  750   workers ~6.8 GB each   cgroup 43 GB
  #   => ~7.8 MB per granule per worker; 64 Gi is reached near granule ~1,090
  #
  # Unbounded, the whole run would need ~113 GB. Rather than request that, we
  # let it OOM: progress is written per granule by the parent, and every
  # restart re-queries `theta_s IS NULL` and resumes, so each pod clears
  # ~1,100 granules. 12,251 granules therefore needs ~11 restarts; 30 is margin.
  backoffLimit: 30         # resumable: filled pixels are skipped before any open
  # Bounded lifetime, for the exit hang in Q10(c): the match job finished its
  # work then blocked forever in concurrent.futures' atexit join on an
  # abandoned pool, holding 16 CPU / 100 Gi for 8.5 h. geometry uses the same
  # pattern. It is idempotent on `theta_s IS NULL`, so a deadline kill costs
  # only the tail and re-running resumes.
  activeDeadlineSeconds: 108000   # 30 h; see the backoffLimit note
  template:
    spec:
      restartPolicy: Never
      # PINNED TO WEST-COAST NODES. This stage is pure network I/O against
      # NASA OB.DAAC in AWS us-west-2, and node placement dominates it:
      #
      #   8 workers on moff.sdstate.edu   13.7 s/granule  -> 0.073 granules/s
      #   1 worker  on humboldt.edu        7.7 s/granule  -> 0.13  granules/s
      #   1 worker  on the workstation     4.7-7.4 s      (Santa Cruz)
      #
      # i.e. ONE California worker beat the entire 8-worker South Dakota pod by
      # ~1.8x, and the 8 workers there bought nothing because they contend for
      # the node's bandwidth (CPU sat at 74 millicores across all 8). Measured
      # 2026-09-27 with an identical CMR-lookup + L1B-open probe.
      #
      # CMR is NOT the bottleneck: the lookup is 0.4-1.4 s, ~1% of the cost. So
      # --jobs 8 is kept purely as the CMR etiquette cap from the working
      # agreements, not because 8 is a throughput choice.
