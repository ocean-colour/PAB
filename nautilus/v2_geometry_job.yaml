      containers:
      - name: pab
        image: gitlab-registry.nrp-nautilus.io/profx/pab:2.0.3   # PAB 99c37ef -- carries the Q8b portable_errors fix
        imagePullPolicy: Always
        env:
        - {name: HOME, value: /root}
        - {name: PAB_DATA_DIR, value: /data/v2}
        - {name: PYTHONWARNINGS, value: "ignore"}
        - {name: RUN, value: /data/v2}
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -o pipefail
            ulimit -n 65536 || true
            log() { echo "=== $1 $(date -Is) ===" | tee -a $RUN/geometry.log; }
            log "FD limit soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
            log "PROVENANCE"
            python -c "import json; from pab.config import package_versions, pab_version; pv=package_versions(); print('pab_version', pab_version); print('git_sha', json.dumps(pv['git_sha']))" 2>&1 | tee -a $RUN/geometry.log
            log "BEFORE"
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['RUN']+'/pab.db'); q=lambda s: c.execute(s).fetchone()[0]; print('pixels', q('SELECT COUNT(*) FROM matchup_pixels')); print('with theta_s', q('SELECT COUNT(*) FROM matchup_pixels WHERE theta_s IS NOT NULL')); print('granules in pixels', q('SELECT COUNT(DISTINCT granule_id) FROM matchups'))" 2>&1 | tee -a $RUN/geometry.log
            log "GEOMETRY start (--jobs 8, whole v2 DB)"
            pab --db $RUN/pab.db --outdir $RUN/pipeline \
                --stage geometry --jobs 8 2>&1 \
              | tee -a $RUN/geometry.log
            log "GEOMETRY end"
            log "GATES"
            python -c "import os,sqlite3; c=sqlite3.connect(os.environ['RUN']+'/pab.db'); q=lambda s: c.execute(s).fetchone(); n=q('SELECT COUNT(*) FROM matchup_pixels')[0]; f=q('SELECT COUNT(*) FROM matchup_pixels WHERE theta_s IS NULL')[0]; print('pixels', n, 'missing theta_s', f, 'GATE', 'PASS' if f==0 else 'FAIL'); print('geom_source', c.execute('SELECT geom_source, COUNT(*) FROM matchup_pixels GROUP BY 1').fetchall()); print('theta_s', q('SELECT MIN(theta_s), MAX(theta_s) FROM matchup_pixels')); print('theta_v', q('SELECT MIN(theta_v), MAX(theta_v) FROM matchup_pixels')); print('dphi', q('SELECT MIN(dphi), MAX(dphi) FROM matchup_pixels')); d=q('SELECT COUNT(*) FROM matchup_pixels WHERE dphi IS NOT NULL AND (dphi <= -180.0 OR dphi > 180.0)')[0]; print('dphi out of (-180,180]', d, 'GATE', 'PASS' if d==0 else 'FAIL')" 2>&1 | tee -a $RUN/geometry.log
            log "disk"
            du -sh $RUN 2>/dev/null | tee -a $RUN/geometry.log
            log "V2_GEOMETRY_DONE"
        resources:
          requests: {cpu: "8", memory: "64Gi", ephemeral-storage: "20Gi"}
          limits: {cpu: "8", memory: "64Gi", ephemeral-storage: "40Gi"}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: netrc, mountPath: /root/.netrc, subPath: .netrc}
        - {name: awscreds, mountPath: /root/.aws/credentials, subPath: credentials}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: pab-data}}
      - {name: netrc, secret: {secretName: earthdata-netrc}}
      - {name: awscreds, secret: {secretName: prp-s3-credentials}}
